<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeturner.com/see-Profile</title>
    <script src="https://kit.fontawesome.com/8908c40066.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <nav class="desktopNav">
            <a href="../../post/index.html">Feed</a>
            <a href="profile.html">Profile</a>
            <a href="settings.html">Settings</a>
            <div>
                <i class="fa-solid fa-magnifying-glass" id="desktopSearchButton"></i>
                <input type="text" placeholder="Search..." id="desktopSearchInput">
            </div>
        </nav>

        <nav class="mobileNav">
            <a href="../../post/index.html"><i class="fa-solid fa-house"></i></a>
            <a href="profile.html"><i class="fa-solid fa-user"></i></a>
            <a href="settings.html"><i class="fa-solid fa-gear"></i></a>
            <div>
                <i class="fa-solid fa-magnifying-glass" id="mobileSearchButton"></i>
                <input type="text" placeholder="Search..." id="mobileSearchInput">
            </div>
        </nav>
    </header>

    <a href="index.html">
        <div id="backButton">
            <i class="fa-solid fa-arrow-left"></i>
            <p>Feed</p>
        </div>
    </a>

    <main id="showProfile">
        <section class="profile-card">
            <img alt="Banner" id="userBanner" class="banner">
            <img alt="Avatar" id="userAvatar" class="avatar">

            <h1 id="usersName">User_name</h1>

            <div id="bioDisplay">
                <h2>Bio</h2>
                <p id="bioText">This bio is empty</p>
            </div>

            <div id="profileInfo"></div>

            <button id="followButton">Follow</button>

            <div id="userPosts">
                <h2 id="userNameProfile">User's posts</h2>
            </div>

           
        </section>
    </main>

    <footer>
        <nav>
          <a href="contact.html">Contact</a>
          <a href="privacy-policy.html">Privacy Policy</a>
          <a href="terms-of-use.html">Terms of use</a>
          <a href="../../index.html"><img src="../../images/footer_logo.png"></a>
        </nav>
    </footer>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
